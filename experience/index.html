  if(!article||!camera?.selectDevice||document.getElementById('cameraDevicePicker'))return;
  const style=document.createElement('style');style.id='camera-device-picker-style';style.textContent=`
  #gestureGuide article{max-height:calc(100vh - 40px);overflow:auto}
  #cameraDevicePicker{border-top:1px solid #b8bea5;margin:18px 0;padding-top:16px;min-width:0;font-family:'Microsoft YaHei','PingFang SC',sans-serif}
  #cameraDevicePicker label{display:block;font-size:16px;font-weight:750;line-height:1.6;margin-bottom:8px}
  #cameraDevicePicker .camera-device-row{display:flex;gap:8px;flex-wrap:wrap}
  #cameraDevicePicker select{width:100%;min-width:0;min-height:46px;padding:10px 12px;border:1px solid #8a9e80;border-radius:12px;background:#fffdf6;color:#203f31;font:650 15px/1.5 'Microsoft YaHei','PingFang SC',sans-serif}
  #cameraDevicePicker button{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-weight:700;font-size:14px;margin:10px 0 0;padding:9px 14px}
  #cameraDevicePicker p{margin:9px 0 0;font-size:13px;font-weight:600;line-height:1.65;color:#3c5644;overflow-wrap:anywhere}
  @media(max-width:420px){#gestureGuide article{padding:20px;max-width:100%}#cameraDevicePicker select{font-size:16px}#cameraDevicePicker .camera-device-row button{flex:1}}
  `;document.head.append(style);
  const section=document.createElement('section');section.id='cameraDevicePicker';section.innerHTML='<label for="cameraDeviceSelect">选择摄像头</label><select id="cameraDeviceSelect" aria-describedby="cameraDeviceStatus"><option value="">自动选择实体摄像头（推荐）</option></select><div class="camera-device-row"><button type="button" id="cameraDeviceApply">应用摄像头</button><button type="button" class="secondary" id="cameraDeviceRefresh">刷新列表</button></div><p id="cameraDeviceStatus" aria-live="polite">先开启手势并允许摄像头，再选择需要使用的镜头。</p>';
  article.insertBefore(section,article.querySelector('#guideClose')||null);

  let editing=false,applying=false;

   const state=camera.status(),selected=editing?select.value:state.preferredDeviceId||'',items=state.devices||[];
   const signature=JSON.stringify(items.map(item=>[item.deviceId,item.label,item.virtual]));
   if(select.dataset.signature!==signature){
    select.replaceChildren();const automatic=document.createElement('option');automatic.value='';automatic.textContent='自动选择实体摄像头（推荐）';select.append(automatic);
    items.forEach((item,index)=>{const option=document.createElement('option');option.value=item.deviceId;option.textContent=(item.label||'摄像头 '+(index+1)+'（开启后显示名称）')+(item.virtual?' · 虚拟摄像头':'');select.append(option);});select.dataset.signature=signature;
   }
   select.value=[...select.options].some(option=>option.value===selected)?selected:'';
   apply.disabled=applying||!!state.pending;refresh.disabled=applying;
   if(!applying){if(state.cameraLabel)message.textContent='当前：'+state.cameraLabel+(state.cameraVirtual?'。可在上方改选实体摄像头。':'。切换后会自动恢复当前手势体验。');else if(items.some(item=>item.label))message.textContent='已找到 '+items.length+' 台摄像头。选好后应用，再开启手势。';}

  refresh.addEventListener('click',event=>{if(!event.isTrusted)return;refresh.disabled=true;message.textContent='正在刷新摄像头列表…';camera.listDevices({refresh:true}).then(items=>{render();if(!items.some(item=>item.label))message.textContent='请先开启手势，并在浏览器提示中允许摄像头，再刷新列表。';},()=>{message.textContent='暂时无法读取摄像头列表，请确认浏览器已获准使用摄像头。';}).finally(()=>refresh.disabled=false);});
  apply.addEventListener('click',event=>{
   if(!event.isTrusted)return;
   try{
    const state=camera.status();if(state.pending){message.textContent='相机正在连接，请待画面出现后再切换。';return;}
    const restart=window.QinglanPortal?.selectCameraDevice;
    if(!restart){message.textContent='场景还在准备，请稍后再试。';return;}
    applying=true;apply.disabled=true;refresh.disabled=true;message.textContent=state.masterLive?'正在切换摄像头并恢复手势…':'正在保存摄像头选择…';
    const result=restart(select.value);editing=false;
    Promise.resolve(result).then(value=>{applying=false;render();if(value?.ok===false||value?.state==='error'||value?.state==='unsupported')message.textContent=value.message||'相机尚未开启，可重新选择摄像头再试。';else if(!camera.status().masterLive)message.textContent='已保存选择。下次开启手势时将使用这台摄像头。';},error=>{applying=false;render();message.textContent=error?.message||'切换失败，请刷新列表后再试。';});
   }catch(error){applying=false;render();message.textContent=error?.message||'切换失败，请刷新列表后再试。';}
  });
  window.addEventListener('portal-camera-state',render);document.getElementById('shellGestureGuide')?.addEventListener('click',render);render();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script><script id="orchid-glove-cursors">/* Small, local SVG garden gloves. Real detector frames are the only visibility source. */

  right.innerHTML='<svg class="glove-art" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg"><g fill="#f7eedc" stroke="#496451" stroke-width="1.5" stroke-linejoin="round"><path class="glove-point" d="M20 65c-1-6-4-11-8-17l-6-9c-2-4 2-7 5-5l12 11V10c0-4 2-6 5-6s5 2 5 6v25c2-4 7-4 9 0 3-3 7-1 8 3 5-1 8 2 8 6l-1 9c-1 6-5 10-8 14Z"/><path class="glove-pinch" d="M20 65c-2-8-6-14-11-22-2-4 1-7 5-5l9 9 10-16-6-13c-2-5-2-11 1-14 5 1 8 6 10 11l6 14 8 5c5 3 7 7 5 13l-3 10-6 10Z"/><path fill="#9b6b7a" d="m19 63 31 2-2 10-28-2Z"/><path fill="none" stroke="#d2adba" stroke-width="1" d="m23 68 22 1"/></g><path d="M30 54c-1-7 3-10 9-10-1 6-3 9-9 10Z" fill="#becda9"/><path d="m29 56 8-9" fill="none" stroke="#7d956b" stroke-width="1"/></svg><span class="glove-contact"></span><span class="glove-label">右手</span>';

  left.innerHTML='<svg class="glove-roll" viewBox="0 0 64 64"><circle class="glove-roll-track" cx="32" cy="32" r="28"/><circle class="glove-roll-progress" cx="32" cy="32" r="28"/></svg><svg class="glove-art" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg"><g transform="translate(64 0) scale(-1 1)"><g stroke="#496451" stroke-width="1.5" stroke-linejoin="round"><path fill="#c4d4b7" d="M20 65c-3-7-6-12-10-18l-7-11c-2-4 2-7 5-4l9 10-3-23c-1-5 5-6 7-2l5 20-1-28c0-5 7-5 8 0l1 27 4-24c1-5 7-4 7 1l-2 24 7-17c2-4 7-2 6 3l-6 22 0 10-4 12Z"/><path fill="#f4efdc" d="m19 63 30 2-2 10-27-2Z"/><path fill="none" stroke="#8ea37a" stroke-width="1" d="m23 68 21 1"/></g><path d="M29 55c-1-7 3-10 9-10-1 6-3 9-9 10Z" fill="#e9efdb"/><path d="m28 57 8-9" fill="none" stroke="#8ba179" stroke-width="1"/></g></svg><span class="glove-label">左手</span>';
  layer.append(right,left);document.body.append(layer);
  var progress=left.querySelector('.glove-roll-progress');
  function activeFrame(win){return Array.prototype.find.call(document.querySelectorAll('.portal-frame'),function(frame){return !frame.hidden&&frame.contentWindow===win;});}
  function role(hand){var api=window.OrchidImmersive;return api&&api.handRole?api.handRole(hand):hand.handedness;}
  function select(side){return hands.filter(function(hand){return role(hand)===side;}).sort(function(a,b){return(Number(b.score)||0)-(Number(a.score)||0);})[0];}
  function onHands(win,detail){
    if(document.hidden||!activeFrame(win))return false;

  }

    right.hidden=!rh;left.hidden=!lh;
    document.documentElement.classList.toggle('orchid-gloves-right',!!rh);
    if(rh){
      var ix=rh.landmarks[8],x=(1-ix.x)*w,y=ix.y*h,pointer=document.getElementById('portalHandPointer');
      if(pointer&&pointer.style.display!=='none'){
        var box=pointer.getBoundingClientRect();if(box.width&&box.height&&box.left+box.width/2>=0&&box.left+box.width/2<=w&&box.top+box.height/2>=0&&box.top+box.height/2<=h){x=box.left+box.width/2;y=box.top+box.height/2;}
      }
      position(right,x,y);right.classList.toggle('is-pinching',Number(rh.pinch)>.68);right.querySelector('.glove-label').textContent=Number(rh.pinch)>.68?'捏合':'右手';

    if(lh){
      var palm=lh.palm,ids=[0,5,9,13,17];
      if(!palm||!Number.isFinite(palm.x)||!Number.isFinite(palm.y)){palm={x:0,y:0};ids.forEach(function(i){palm.x+=lh.landmarks[i].x/5;palm.y+=lh.landmarks[i].y/5;});}
      position(left,(1-palm.x)*w,palm.y*h);
      var wrist=lh.landmarks[0],middle=lh.landmarks[9],angle=Math.atan2(-(middle.x-wrist.x)*sourceWidth,-(middle.y-wrist.y)*sourceHeight)*180/Math.PI;

</script><script id="orchid-performance-ui">(()=>{

  const guide=document.querySelector('#gestureGuide article'),api=window.OrchidPerformance;if(!guide||!api||document.getElementById('qualityProfilePicker'))return;
  const style=document.createElement('style');style.textContent=`#qualityProfilePicker{border-top:1px solid #b8bea5;margin:18px 0;padding-top:14px;font-family:'Microsoft YaHei','PingFang SC',sans-serif}#qualityProfilePicker strong{display:block;font-size:16px;font-weight:750;margin-bottom:8px}#qualityProfilePicker button{font:700 14px/1.5 'Microsoft YaHei','PingFang SC',sans-serif;margin:4px 7px 0 0;min-height:44px}#qualityProfilePicker button[aria-pressed=true]{background:#214b38!important;color:#fff9e8!important;box-shadow:inset 0 0 0 2px #b9c99a}#qualityProfilePicker button[aria-pressed=false]{background:#f8f5e9!important;color:#214638!important}#qualityProfilePicker p{margin:9px 0 0;font-size:13px;font-weight:600;line-height:1.65;color:#3c5644}`;document.head.append(style);
  const section=document.createElement('section');section.id='qualityProfilePicker';section.innerHTML='<strong>运行效果</strong><div role="group" aria-label="运行效果"><button type="button" data-quality-profile="fluid">流畅模式</button><button type="button" data-quality-profile="full">完整效果</button></div><p id="qualityProfileStatus" aria-live="polite"></p>';guide.insertBefore(section,guide.querySelector('#guideClose')||null);
  function render(){const state=api.settings();for(const button of section.querySelectorAll('[data-quality-profile]'))button.setAttribute('aria-pressed',String(button.dataset.qualityProfile===state.profile));section.querySelector('p').textContent=state.profile==='fluid'?'流畅模式：减少背景动效与玻璃模糊，保留花朵开合、手势和操作。'+(state.reason==='native-intel-mac'?'此 Intel Mac 默认使用。':''):state.profile==='balanced'?'当前为自动均衡效果。可选流畅模式减少画面负担，或选完整效果。':'完整效果：使用原有清晰度、背景动效与玻璃质感。';}
