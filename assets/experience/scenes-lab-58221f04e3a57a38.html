    footer.append(make('p', 'archive-reference-notice', '公开资料整理；不表示本研究站保存了该种活体。'));

  }
  function boot() {
    const body = document.getElementById(BODY_ID);
    if (!body) return;

    version: 'v65.1',
    enhance,

})();

</script><script id="experience-bridge">(() => {

<script id="qinglan-camera-preview-runtime">(function previewRuntime(mode) {
  'use strict';
  if (window.OrchidCameraPreview) return;
  var last = {}, observedVideo = null, bar = null, label = null, message = null;
  var ids = mode === 'shop'
    ? { video: 'mobileHandVideo', host: 'cameraPreviewDock', button: 'startMobileCamera' }
    : mode === 'lab'
      ? { video: 'bloomVideo', host: 'cameraPod', button: 'labStartCamera' }
      : { video: 'bloomVideo', host: 'cameraWrap', button: 'startBloomCamera' };
  var style = document.createElement('style');
  style.id = 'qinglan-camera-preview-style';
  style.textContent =
    '#qinglanCameraProgress[hidden]{display:none!important}' +
    '#qinglanCameraProgress{box-sizing:border-box;display:flex;flex-direction:column;gap:5px;padding:12px 15px;border:1px solid #aab99a;border-radius:12px;background:#eef0df;color:#214c38;text-align:left;font:650 14px/1.55 "Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:0;overflow-wrap:anywhere}' +
    '#qinglanCameraProgress strong{font:800 15px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:0;color:#214c38}' +
    '#qinglanCameraProgress span{font-weight:650}' +
    '#cameraWrap+#qinglanCameraProgress{margin:12px 0 0}' +
    '#cameraPod[data-camera-preparing="true"]{width:min(300px,calc(100vw - 24px))}' +
    '#cameraPod>#qinglanCameraProgress{margin:5px 8px 0;padding:9px 10px;border-radius:9px;font-size:12px}' +
    '#cameraPod>#qinglanCameraProgress strong{font-size:13px}' +
    '#cameraPod[data-camera-preparing="true"]>#labCameraMessage{display:none}' +
    '#cameraPreviewDock[data-camera-preparing="true"]{flex-wrap:wrap;max-width:min(340px,calc(100vw - 24px))}' +
    '#cameraPreviewDock>#qinglanCameraProgress{flex:0 0 100%;order:10;padding:8px 10px;font-size:12px;border-radius:8px}' +
    '#cameraPreviewDock>#qinglanCameraProgress strong{font-size:13px}' +
    '#cameraPreviewDock[data-camera-preparing="true"] #cameraPreviewStatus{font:750 12px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;white-space:normal;max-width:140px}' +
    '@media(max-width:700px){#qinglanCameraProgress{padding:11px 12px;font-size:14px}#qinglanCameraProgress strong{font-size:14px}}';
  document.head.appendChild(style);
  function text(node, value) { if (node && node.textContent !== value) node.textContent = value; }
  function engine() { return window.OrchidHands || window.QinglanCamera; }
  function ready(video, detail) {
    return !!(detail.camera && video && video.srcObject && video.readyState >= 2 &&
      !video.paused && video.videoWidth > 0 && video.videoHeight > 0);
  }
  function installBar(host) {
    if (bar || !host) return;
    // Bloom already has a full-width status message beside its touch controls.
    // Reuse it instead of repeating the same download progress twice.
    if (mode === 'bloom') { message = document.getElementById('cameraMessage'); return; }
    bar = document.createElement('div'); bar.id = 'qinglanCameraProgress';
    bar.hidden = true; bar.setAttribute('role', 'status'); bar.setAttribute('aria-live', 'polite');
    label = document.createElement('strong'); label.id = 'qinglanCameraProgressLabel';
    message = document.createElement('span'); message.id = 'qinglanCameraProgressMessage';
    bar.appendChild(label); bar.appendChild(message);
    host.appendChild(bar);
  }
  function observe(video) {
    if (!video || video === observedVideo) return;
    if (observedVideo) ['loadeddata', 'playing', 'resize', 'emptied', 'pause'].forEach(function (name) {
      observedVideo.removeEventListener(name, onVideo);
    });
    observedVideo = video;
    ['loadeddata', 'playing', 'resize', 'emptied', 'pause'].forEach(function (name) {
      video.addEventListener(name, onVideo);
    });
  }
  function onVideo() { draw(last); }
  function draw(detail) {
    last = detail || {};
    var host = document.getElementById(ids.host), video = document.getElementById(ids.video);
    installBar(host); observe(video);
    var busy = last.state === 'requesting' || last.state === 'loading';
    var running = last.state === 'running' || last.running === true;
    var previewReady = ready(video, last);
    if (host) host.setAttribute('data-camera-preparing', String(busy));
    if (bar) {
      bar.hidden = !busy;
      if (busy) {
        text(label, previewReady ? '摄像头已连接' : '正在连接摄像头');
        text(message, last.message || (previewReady ? '画面已经就绪，正在启动手势识别…' : '请在浏览器提示中允许摄像头。'));
      }
    }
    var button = document.getElementById(ids.button);
    if (busy && button) text(button, previewReady ? '手势加载中…' : '正在连接摄像头…');
    if (mode === 'bloom') {
      if (busy) text(message, (previewReady ? '摄像头已连接 · ' : '') + (last.message || '正在连接手势…'));
      var placeholder = document.getElementById('cameraEmpty');
      if (placeholder) placeholder.hidden = running || previewReady;
      text(document.getElementById('cameraBadge'), running || previewReady ? 'CAMERA / LIVE' : busy ? 'CAMERA / PREPARING' : 'CAMERA / OFF');
      if (busy && previewReady) text(document.getElementById('handsBadge'), '手势加载中');
      else if (running && document.getElementById('handsBadge') && document.getElementById('handsBadge').textContent === '手势加载中') text(document.getElementById('handsBadge'), '等待你的手');
    } else if (mode === 'lab') {
      if (busy && previewReady) text(document.getElementById('cameraHandCount'), '摄像头已连接');
      else if (running && document.getElementById('cameraHandCount') && document.getElementById('cameraHandCount').textContent === '摄像头已连接') text(document.getElementById('cameraHandCount'), '等待手部');

    }
  });

})("lab");</script>
